<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../design/base.css">
<style>
  .title { margin-bottom: 30px; }
  .dia { display: grid; grid-template-columns: auto 44px auto 1fr auto 48px auto; grid-template-rows: auto 40px auto; align-items: center; }
  #diff { grid-column: 1; grid-row: 3; font-size: 26px; padding: 14px 20px; }
  .cls { grid-column: 3; grid-row: 3; position: relative; }
  .notes { position: absolute; left: 50%; top: calc(100% + 16px); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .if { font-size: 20px; line-height: 1.3; padding: 6px 14px; border-radius: 10px; font-variant-ligatures: none; }
  .dia { padding-bottom: 50px; }
  #quick { grid-column: 5 / 8; grid-row: 1; justify-self: end; }
  .team { grid-column: 5; grid-row: 3; display: flex; flex-direction: column; gap: 12px; padding: 12px; border: 2px dashed var(--accent-border); border-radius: 20px; }
  .team .node { font-size: 24px; padding: 9px 18px; }
  #judge { grid-column: 7; grid-row: 3; padding: 16px 22px; }
</style></head><body>
<div class="frame">
  <div class="kicker">08 · Route in code</div>
  <h1 class="title">Claude <em>decides</em>. Code <em>routes</em>.</h1>
  <div class="dia">
    <div class="node" id="diff">your diff</div>
    <div class="cls">
      <div class="node accent" id="cls">Classify<small>1 subagent</small></div>
      <div class="notes">
        <span class="pill accent">size: small | big</span>
        <div class="code if"><span class="k">if</span> (size === <span class="s">'big'</span>)</div>
      </div>
    </div>
    <div class="node green" id="quick">1 quick review</div>
    <div class="team" id="team">
      <div class="node accent">correctness</div>
      <div class="node accent">security</div>
      <div class="node accent">performance</div>
    </div>
    <div class="node dark" id="judge">Judge</div>
  </div>
  <div class="caption"><b>Claude makes the call.</b><br>Code doesn't change its mind.</div>
</div>
<script src="../design/wires.js"></script>
<script>
draw(() => {
  wire('diff', 'cls');
  wire('cls', 'quick', { from: 'top', to: 'left', label: 'small' });
  wire('cls', 'team', { from: 'right', to: 'left', label: 'big' });
  wire('team', 'judge', { from: 'right', to: 'left' });
});
</script>
</body></html>

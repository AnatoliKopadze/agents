<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../design/base.css">
<style>
  .title { margin-bottom: 30px; }
  .fan { position: relative; display: grid; grid-template-columns: auto 62px auto 1fr auto; align-items: center; }
  #plan { grid-column: 1; padding: 16px 15px; font-size: 22px; }
  #plan small { font-size: 18px; line-height: 1.3; }
  .team { display: grid; grid-template-columns: auto auto; gap: 14px 8px; padding: 14px 10px;
          border: 2px dashed var(--accent-border); border-radius: 20px; grid-column: 3; }
  .team .node { font-size: 21px; padding: 6px 10px; border-radius: 12px; }
  .team .node.gray { border-color: #D3CABC; }
  .team .more { grid-column: 1 / -1; justify-self: center; }
  .right { grid-column: 5; display: flex; flex-direction: column; align-items: center; }
  #ans { padding: 14px 19px; }
  #ans .num { display: block; font: 800 40px/1 'Inter Display', 'Inter', sans-serif; letter-spacing: -0.02em; margin-bottom: 4px; }
  #dropped { position: absolute; }
  #dropped, .pill.gray { background: var(--gray-soft); border-color: #D3CABC; color: #6F685F; }
  .foot { display: flex; justify-content: center; gap: 18px; margin-top: 34px; }
  .foot .pill { font: 600 20px/1.2 'Inter', sans-serif; letter-spacing: 0; padding: 6px 14px; }
  .caption { margin-top: 32px; }
</style></head><body>
<div class="frame">
  <div class="kicker">05 · Fan out</div>
  <h1 class="title">One plan. <em>40 subagents.</em></h1>
  <div class="fan" id="fan">
    <div class="node dark mono" id="plan">parallel()<small>your plan,<br>plain JS</small></div>
    <div class="team" id="team">
      <div class="node accent mono">file 1</div>
      <div class="node accent mono">file 5</div>
      <div class="node accent mono">file 2</div>
      <div class="node gray mono dead" id="f6">file 6</div>
      <div class="node accent mono">file 3</div>
      <div class="node accent mono">file 7</div>
      <div class="node accent mono">file 4</div>
      <div class="node accent mono">file 8</div>
      <div class="node ghost mono more">+ 32 more</div>
    </div>
    <div class="right">
      <div class="node green" id="ans"><span class="num">39</span>answers</div>
    </div>
    <div class="pill" id="dropped">dropped</div>
  </div>
  <div class="foot">
    <span class="pill">each one: its own clean context</span>
    <span class="pill">a handful run at a time, the rest wait their turn</span>
  </div>
  <div class="caption"><b>Your main session never holds 40 files.</b><br>Only answers come back.</div>
</div>
<script src="../design/wires.js"></script>
<script>
draw(() => {
  // park the "dropped" pill above the answers box, level with the first row of files
  const fan = document.getElementById('fan').getBoundingClientRect();
  const ans = document.getElementById('ans').getBoundingClientRect();
  const team = document.getElementById('team').getBoundingClientRect();
  const d = document.getElementById('dropped');
  const first = document.querySelector('.team .node').getBoundingClientRect();
  d.style.left = (ans.left + ans.width / 2 - d.offsetWidth / 2 - fan.left) + 'px';
  d.style.top = (first.top + first.height / 2 - d.offsetHeight / 2 - fan.top) + 'px';

  wire('plan', 'team', { from: 'right', to: 'left' });
  wire('team', 'ans', { color: 'green', from: 'right', to: 'left', label: '.filter(Boolean)' });
  wire('f6', 'dropped', { color: 'muted', dashed: true, from: 'right', to: 'left', label: 'null', labelClass: 'gray', t: 0.25, curve: 0.45 });
});
</script>
</body></html>
